<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace Client — Estrecho Capital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #0B1420;
    --navy-deep: #070C14;
    --stone: #EFE9D9;
    --stone-warm: #E6DFC9;
    --ink: #1E1A12;
    --ivory: #F5F1E7;
    --card: #FFFFFF;
    --copper: #FABD00;
    --copper-deep: #D9A300;
    --line: rgba(30,26,18,0.12);
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}

  body{
    font-family:'Work Sans', sans-serif;
    color:var(--ink);
    line-height:1.6;
    font-size:16px;
    background:var(--navy);
  }

  h1,h2,h3{
    font-family:'Playfair Display', serif;
    font-weight:700;
    letter-spacing:-0.01em;
    line-height:1.15;
  }

  a{color:inherit;}
  .wrap{max-width:1120px; margin:0 auto; padding:0 32px;}

  /* ---------- HEADER ---------- */
  header{
    background:var(--stone);
    border-bottom:1px solid var(--line);
  }
  nav.wrap{
    display:flex; align-items:center; justify-content:space-between;
    height:76px;
    padding-left:24px;
    padding-right:24px;
  }
  .brand{display:flex; align-items:center; gap:10px; text-decoration:none;}
  .brand-mark{
    width:34px; height:34px;
    background:var(--navy); color:var(--copper);
    display:flex; align-items:center; justify-content:center;
    font-family:'Playfair Display', serif; font-weight:700; font-size:1rem;
    flex-shrink:0;
  }
  .brand-text{font-family:'Playfair Display', serif; font-weight:700; font-size:1.05rem; color:var(--ink); line-height:1.2;}
  .brand-text small{display:block; font-family:'Work Sans', sans-serif; font-size:0.6rem; letter-spacing:0.1em; color:var(--copper-deep); font-weight:600; margin-top:2px;}
  .role-nav{display:flex; align-items:center; gap:22px;}
  .role-nav a{
    font-size:0.84rem;
    font-weight:600;
    color:rgba(30,26,18,0.55);
    text-decoration:none;
    padding-bottom:3px;
  }
  .role-nav a.current{color:var(--navy); border-bottom:2px solid var(--copper);}
  .role-nav a:hover{color:var(--navy);}
  .back-link{
    font-size:0.86rem;
    font-weight:600;
    color:rgba(30,26,18,0.7);
    text-decoration:none;
  }
  .back-link:hover{color:var(--navy);}

  /* ---------- MAIN ---------- */
  main{
    min-height:calc(100vh - 77px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:64px 24px;
    position:relative;
    overflow:hidden;
  }
  main::after{
    content:"";
    position:absolute;
    right:8%; top:18%;
    width:6px; height:6px; border-radius:50%;
    background:rgba(250,189,0,0.5);
  }
  main::before{
    content:"";
    position:absolute;
    left:10%; bottom:22%;
    width:4px; height:4px; border-radius:50%;
    background:rgba(250,189,0,0.35);
  }

  .login-wrap{
    position:relative; z-index:2;
    width:100%;
    max-width:440px;
  }
  .login-intro{text-align:center; margin-bottom:32px; color:var(--ivory);}
  .login-intro .tag{
    font-size:0.78rem;
    font-weight:700;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--copper);
    margin-bottom:12px;
  }
  .login-intro h1{font-size:2rem; color:var(--ivory); margin-bottom:14px;}
  .login-intro p{
    font-size:0.94rem;
    color:rgba(245,241,231,0.65);
    max-width:380px;
    margin:0 auto;
  }

  /* ---------- CARD ---------- */
  .login-card{
    background:var(--card);
    border-top:3px solid var(--copper);
    padding:38px 34px;
    margin-top:32px;
  }
  .login-card form{display:flex; flex-direction:column; gap:18px;}
  .login-card label{
    font-size:0.68rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:rgba(30,26,18,0.6);
    font-weight:600;
    display:block;
    margin-bottom:7px;
  }
  .login-card input{
    width:100%;
    border:1px solid var(--line);
    background:var(--stone);
    padding:11px 12px;
    font-family:'Work Sans', sans-serif;
    font-size:0.9rem;
    color:var(--ink);
  }
  .login-card input:focus{outline:none; border-color:var(--copper);}
  .login-row{display:flex; justify-content:space-between; align-items:center; font-size:0.82rem;}
  .login-row label.remember{
    display:flex; align-items:center; gap:7px;
    text-transform:none; letter-spacing:0; font-weight:500; color:rgba(30,26,18,0.65);
  }
  .login-row a{color:var(--copper-deep); text-decoration:none; font-weight:600;}
  .login-row a:hover{text-decoration:underline;}
  .btn-primary{
    display:block;
    width:100%;
    background:var(--copper);
    color:var(--navy-deep);
    padding:14px 26px;
    text-decoration:none;
    font-weight:700;
    font-size:0.94rem;
    border:none;
    cursor:pointer;
    font-family:'Work Sans', sans-serif;
    text-align:center;
    transition:background .2s ease;
  }
  .btn-primary:hover{background:#ffce33;}

  .login-foot{
    text-align:center;
    font-size:0.86rem;
    color:rgba(30,26,18,0.55);
    margin-top:22px;
    padding-top:22px;
    border-top:1px solid var(--line);
  }
  .login-foot a{color:var(--copper-deep); text-decoration:none; font-weight:600;}
  .login-foot a:hover{text-decoration:underline;}

  @media (max-width:520px){
    .login-card{padding:30px 24px;}
    .role-nav{display:none;}
  }
</style>
</head>
<body>

<header>
  <nav class="wrap">
    <a class="brand" href="index.html">
      <div class="brand-mark">E</div>
      <div class="brand-text">Estrecho Capital<small data-i18n="brand-sub">Guichet unique investisseurs</small></div>
    </a>
    <div class="role-nav">
      <a href="connexion-client.html" class="current" data-i18n="role-client">Client</a>
      <a href="connexion-partenaire.html" class="" data-i18n="role-partenaire">Partenaire</a>
      <a href="connexion-prestataire.html" class="" data-i18n="role-prestataire">Prestataire</a>
    </div>
    <a class="back-link" href="index.html" data-i18n="back-link">&larr; Retour au site</a>
  </nav>
</header>

<main>
  <div class="login-wrap">
    <div class="login-intro">
      <p class="tag" data-i18n="login-tag">Mon Espace &mdash; Espace Client</p>
      <h1 data-i18n="login-h1">Connexion Client</h1>
      <p data-i18n="login-blurb">Suivez l'avancement de votre dossier &mdash; étude, financement, structuration &mdash; en temps réel.</p>
    </div>

    <div class="login-card">
      <form>
        <div>
          <label for="login-email" data-i18n="label-email">Email</label>
          <input type="email" id="login-email" placeholder="votre@email.com">
        </div>
        <div>
          <label for="login-password" data-i18n="label-password">Mot de passe</label>
          <input type="password" id="login-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
        </div>
        <div class="login-row">
          <label class="remember" data-i18n="remember"><input type="checkbox" style="width:auto;"> Se souvenir de moi</label>
          <a href="#" data-i18n="forgot">Mot de passe oublié ?</a>
        </div>
        <button type="submit" class="btn-primary" onclick="window.location.href='dashboard-client.html'; return false;" data-i18n="submit">Se connecter</button>
      </form>
      <p class="login-foot" data-i18n="login-foot">Pas encore de compte ? <a href="index.html#contact">Contactez-nous</a></p>
    </div>
  </div>
</main>


<script>
(function(){
  var ES = {"role-client": "Cliente", "role-partenaire": "Socio", "role-prestataire": "Proveedor", "back-link": "&larr; Volver al sitio", "brand-sub": "Ventanilla única para inversores", "login-tag": "Mi Espacio &mdash; Área Cliente", "login-h1": "Acceso Cliente", "login-blurb": "Siga el avance de su expediente &mdash; estudio, financiación, estructuración &mdash; en tiempo real.", "label-email": "Correo electrónico", "label-password": "Contraseña", "remember": "<input type=\"checkbox\" style=\"width:auto;\"> Recordarme", "forgot": "¿Olvidó su contraseña?", "submit": "Iniciar sesión", "login-foot": "¿Aún no tiene cuenta? <a href=\"index.html#contact\">Contáctenos</a>", "_title": "Acceso Cliente — Estrecho Capital"};
  var frTitle = document.title;
  var i18nEls = Array.prototype.slice.call(document.querySelectorAll('[data-i18n]'));
  var frCache = new Map();
  i18nEls.forEach(function(el){ frCache.set(el, el.innerHTML); });
  var phEls = Array.prototype.slice.call(document.querySelectorAll('[data-i18n-ph]'));
  var frPhCache = new Map();
  phEls.forEach(function(el){ frPhCache.set(el, el.getAttribute('placeholder')); });

  function setLang(lang){
    document.documentElement.lang = lang;
    if(lang === 'es'){
      i18nEls.forEach(function(el){
        var key = el.getAttribute('data-i18n');
        if(ES[key] !== undefined) el.innerHTML = ES[key];
      });
      phEls.forEach(function(el){
        var key = el.getAttribute('data-i18n-ph');
        if(ES[key] !== undefined) el.setAttribute('placeholder', ES[key]);
      });
      if(ES['_title']) document.title = ES['_title'];
    } else {
      i18nEls.forEach(function(el){ el.innerHTML = frCache.get(el); });
      phEls.forEach(function(el){ el.setAttribute('placeholder', frPhCache.get(el)); });
      document.title = frTitle;
    }
  }

  var saved = localStorage.getItem('estrecho_lang');
  if(saved === 'es'){ setLang('es'); }
})();
</script>
</body>
</html>
